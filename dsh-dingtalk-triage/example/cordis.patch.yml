# 把这一段加进 $DSH_HOME/profiles/web/cordis.patch.yml
# 改配置保存即热生效；改 index.js 代码需要重启桌面端。
- insert:
    - id: dingtalk-triage
      name: 'file:///C:/Users/you/plugins/dsh-dingtalk-triage/index.js'
      config:
        enabled: true
        clientId: ''            # 钉钉 Client ID（AppKey）
        clientSecret: ''        # 钉钉 Client Secret（AppSecret）
        dataDir: 'C:\Users\you\.dsh\data\dingtalk-triage'
        selfBaseUrl: 'http://127.0.0.1:43129'   # 改成你的 web 端口
        requireMention: true
        replyFormat: markdown
        turnTimeoutMs: 900000
        maxReplyChars: 3800
        pythonPath: 'python'    # 有 pymysql 的解释器；没有就删掉这行，取数不可用

        # 项目：扫这些根目录，每个非点号子目录 = 一个项目
        projectRoots:
          - 'D:/code'
        excludedProjects:
          - 'tmp'

        # 入口 → 项目。群只认 conversationId，单聊认 staffId 或昵称
        routes:
          - conversationId: 'cidXXXXXXXXXXXX=='
            project: your-project
            label: 你的运维群
          - senderNick: 张三
            project: your-project
            label: 张三单聊

        # 环境 skill（可选）：让主会话知道去哪里找连接资料
        envSkills:
          your-project:
            - your-project-production
            - your-project-test

        # 取数通道（可选）：密码放文件，不要写进配置
        databases:
          your-project:
            host: 'your-mysql-host'
            port: 3306
            user: 'readonly_user'
            database: ''                 # 留空则 SQL 里用 库名.表名
            passwordFile: 'C:\Users\you\.dsh\data\dingtalk-triage\secrets\db.txt'

        # 话题切换阈值（默认 0.5）：追问被拆就调高，不同问题被合并就调低
        topicThreshold: 0.5
