# 把这一段加进 $DSH_HOME/profiles/web/cordis.patch.yml
# 改配置保存即热生效；改 index.js 的代码需要重启桌面端（Harness 按「行 id + 文件路径」缓存模块）。
- insert:
    - id: dingtalk-triage-bridge
      name: 'file:///C:/Users/you/.dsh/plugins/dsh-dingtalk-triage/index.js'
      config:
        enabled: true
        clientId: ''           # 钉钉应用 Client ID（AppKey）
        clientSecret: ''       # 钉钉应用 Client Secret（AppSecret）
        dataDir: 'C:\Users\you\.dsh\data\dingtalk-triage'
        requireMention: true
        replyFormat: markdown
        turnTimeoutMs: 900000
        maxReplyChars: 3800
        # 项目不写死：根下每个非点号子目录就是一个项目（目录名=项目名）
        projectRoots:
          - 'D:\code'
        excludedProjects:
          - '315'
        routes:
          # 群：机器人进群后 @ 一次，从 /dingtalk-triage/status?refresh=1
          # 的 recent[].conversationId 复制真实值
          - conversationId: 'cid金地运营群=='
            project: jindi
            label: 金地运营群
          # 单聊：senderStaffId 最稳，senderNick 起步快
          - senderNick: 乐君兰
            project: jindi
            label: 乐君兰单聊
